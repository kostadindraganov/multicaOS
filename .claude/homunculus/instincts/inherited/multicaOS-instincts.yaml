# MulticaOS Workflow Add Or Evolve Database Table Or Column

## Action

Follow the add-or-evolve-database-table-or-column workflow:
1. Edit or add SQL migration files in server/migrations/ (e.g., .up.sql/.down.sql)
2. Update SQL query definitions in server/pkg/db/queries/*.sql
3. Regenerate Go code for queries and models in server/pkg/db/generated/*.go
4. Update related Go structs or service logic in server/internal/handler/, server/internal/service/, or server/pkg/db/generated/
5. Add or update tests for new schema or handler logic
6. Update API schemas/types if exposed (e.g., packages/core/api/schemas.ts, packages/core/types/*.ts)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: server/migrations/*.sql, server/pkg/db/queries/*.sql, server/pkg/db/generated/*.go

